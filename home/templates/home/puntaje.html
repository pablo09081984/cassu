{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Puntaje y premios - Cassu</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #030000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background-color: #111;
            padding: 30px;
            border-radius: 12px;
            width: 480px;
            box-shadow: 0 0 12px rgba(0,0,0,0.6);
        }
        h1 { margin-top: 0; text-align: center; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px;
            text-align: left;
        }
        th { background-color: #222; }
        .back {
            margin-top: 15px;
            display: block;
            text-align: center;
            color: #ccc;
            text-decoration: none;
        }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <h1>Puntaje (premios)</h1>
    <p>Acá podés ver un ejemplo de cómo funcionaría el sistema de puntos.</p>

    <table>
        <tr>
            <th>Acción</th>
            <th>Puntos</th>
        </tr>
        <tr>
            <td>Almuerzo en Cassu</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Traer a un amigo nuevo</td>
            <td>25</td>
        </tr>
        <tr>
            <td>Plan mensual completo</td>
            <td>80</td>
        </tr>
    </table>

    <p style="margin-top: 15px;">
        Ejemplo: con 100 puntos podés canjear un almuerzo gratis.
    </p>

    <a href="{% url 'index' %}" class="back">⬅ Volver al menú</a>
</div>
</body>
</html>
